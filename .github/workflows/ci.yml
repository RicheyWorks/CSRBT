# ADR-009 G0 — CI without the build-system migration: run the existing Ant build as-is.
# The Gradle/JMH/coverage migration (G1) is held until publishing/external contributors;
# this workflow is the honest interim. Matrix runs 17 (the compile target) and 21 (forward
# compatibility); build.xml uses release="17" so both produce identical bytecode.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    name: ant clean test (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Build and test
        run: ant clean test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: build/test-reports/

# ADR-013 — G1 fired: CI runs the Gradle build (replaces the G0 Ant interim).
# Gradle version is pinned explicitly so the workflow is green even before the
# wrapper jar is committed (host-side `gradle wrapper`, action item 4); the
# toolchain in each module pins compilation to 17 regardless of runner JDK.
# Matrix keeps G0's shape: 17 (compile target) and 21 (forward compatibility).
name: ci

# ADR-202: A PATH FILTER, BECAUSE A CHECK NOBODY CAN AFFORD IS A CHECK THAT
# DOES NOT RUN. This matrix rebuilds the Java tree twice on every push to every
# branch, and the kit's last dozen slices are harness and page work containing
# no Java at all -- so the minutes went on rebuilding a tree nothing had
# changed, and ran out, which turns the check DARK on the pushes that do touch
# the build. The list is an ALLOW-list rather than a deny-list: a module added
# tomorrow lands under `**/*.java` and `**/src/**` on the day it appears, where
# a deny-list would silently stop covering it. The workflow is in its own
# filter, because a change to the build's definition that does not run the
# build cannot be told from one that skipped it on purpose.
#
# tools/verify/verify_ci.py holds this list to what the build actually reads:
# it walks the tree, collects every file Gradle compiles, packages or is
# configured by, and fails if one of them falls outside. A filter that misses a
# file is worse than no filter, because the green history then means the build
# did not run rather than that it passed.
on:
  push:
    branches: ["**"]
    paths:
      - "**/*.java"
      - "**/*.kt"
      - "**/*.kts"
      - "**/src/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "gradle.properties"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**/*.java"
      - "**/*.kt"
      - "**/*.kts"
      - "**/src/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "gradle.properties"
      - ".github/workflows/ci.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"   # runner deprecation notice, 2026-06-16

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    name: gradle build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"
      - name: Build and test
        run: gradle build
      - name: Coverage report
        run: gradle :csrbt-core:jacocoTestReport
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            **/build/reports/tests/test
            csrbt-core/build/reports/jacoco
